name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test Library
        working-directory: Build
        run: npx jest --silent

      - name: Build Library
        working-directory: Build
        run: npm run build

      - name: Build Demo
        working-directory: Demo
        run: npx tsc --noEmit

      - name: Build Docs
        working-directory: Docs
        run: npm run build
