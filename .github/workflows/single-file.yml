name: Create single file Demo

on:
  push:
    branches: ["*"]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # Using latest Node 22 for 2026 compatibility

      - name: Install dependencies
        working-directory: Demo
        run: npm i

      - name: Demo
        working-directory: Demo
        run: npm run build:single

      - name: Rename for distribution
        working-directory: Demo/dist
        run: mv index.html UTAUjsEditor.html

      - name: Upload Demo Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UTAUjsEditor-Standalone
          path: Demo/dist/UTAUjsEditor.html
          if-no-files-found: error
