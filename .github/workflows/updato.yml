name: Updato CDN
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build Library
        working-directory: Build
        run: npm run build

      - name: Build Demo
        working-directory: Demo
        run: npm run build

      - uses: NellowTCS/updato@1.0.3
        with:
          mode: commit
          dist_dir: Demo/dist
          build_script: ""
          github_token: ${{ secrets.GITHUB_TOKEN }}
